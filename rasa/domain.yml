  utter_bahia_facts:
  - text: "Did you know that Bahia is a Brazilian state located in the Northeast Region with 14.9 million inhabitants?"
  - text: "Here's an interesting fact: Bahia is the fourth largest state in Brazil by population!"
  - text: "Did you know that Salvador, Bahia's capital, was Brazil's first capital from 1549 to 1763?"
  - text: "Bahia is fascinating! It's located in Northeast Brazil and has a rich historical background."

  utter_bahia_geography:
  - text: "Bahia's geography features plains and depressions, with most elevations above 300 meters. The highest point is Pico do Barbado at 2,033 meters!"
  - text: "Did you know that Bahia has diverse terrain including the Serra do Espinhaço and Chapada Diamantina?"
  - text: "The state's relief includes plateaus, coastal plains, and tablelands, creating a varied landscape."
  - text: "Bahia's geography is characterized by the Depression Sertaneja and São Francisco in the west and plateaus in the east."

  utter_bahia_climate:
  - text: "Bahia has two main climate types: semi-arid in the central and western regions, and tropical along the coast."
  - text: "Did you know that coastal areas of Bahia can receive over 2,000mm of rainfall annually?"
  - text: "The semi-arid regions have irregular precipitation with dry winters, while coastal areas are more humid."
  - text: "Bahia's climate varies from high temperatures with low humidity inland to tropical conditions on the coast."

  utter_bahia_economy:
  - text: "Bahia has the main economy in Northeast Brazil, focusing on the tertiary sector and manufacturing industry."
  - text: "Did you know that Bahia's economy leads the Northeast region of Brazil?"
  - text: "The state's economic strength comes from services and manufacturing sectors."
  - text: "Bahia plays a crucial economic role in Northeast Brazil with its diverse industrial base."

  utter_ask_about_bahia:
  - text: "What would you like to know about Bahia? I can tell you about its geography, climate, economy, or interesting facts!"
  - text: "Bahia is a fascinating Brazilian state! Are you interested in learning about its history, geography, or culture?"
  - text: "I'd be happy to share information about Bahia! What aspect interests you most?"
  - text: "Bahia has so much to offer! Would you like to know about its climate, geography, or historical significance?"

  utter_ask_interested_in:
  - text: "That's interesting! I'd love to learn more about your interests."
  - text: "Great! It's always nice to know what people are passionate about."
  - text: "Those are fascinating interests! Thanks for sharing that with me."
  - text: "How wonderful! I enjoy learning about what makes people tick."
  - text: "That's really cool! Your interests sound engaging."

